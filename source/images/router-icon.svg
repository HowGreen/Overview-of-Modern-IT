<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="100"
   height="100"
   viewBox="0 0 100 100"
   version="1.1"
   id="router-icon"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1"></defs>
  <!-- Router Main Body -->
  <rect
     x="10"
     y="40"
     width="80"
     height="25"
     rx="2"
     ry="2"
     fill="#ffffff"
     stroke="#333333"
     stroke-width="2" />
  
  <!-- Connection Ports -->
  <rect
     x="17"
     y="55"
     width="10"
     height="5"
     rx="1"
     ry="1"
     fill="#ddd"
     stroke="#333333"
     stroke-width="1" />
  <rect
     x="32"
     y="55"
     width="10"
     height="5"
     rx="1"
     ry="1"
     fill="#ddd"
     stroke="#333333"
     stroke-width="1" />
  <rect
     x="47"
     y="55"
     width="10"
     height="5"
     rx="1"
     ry="1"
     fill="#ddd"
     stroke="#333333"
     stroke-width="1" />
  <rect
     x="62"
     y="55"
     width="10"
     height="5"
     rx="1"
     ry="1"
     fill="#ddd"
     stroke="#333333"
     stroke-width="1" />
  <rect
     x="77"
     y="55"
     width="10"
     height="5"
     rx="1"
     ry="1"
     fill="#ddd"
     stroke="#333333"
     stroke-width="1" />
  
  <!-- Status Lights -->
  <circle
     cx="20"
     cy="47"
     r="2"
     fill="#66ff66"
     stroke="#333333"
     stroke-width="0.5" />
  <circle
     cx="30"
     cy="47"
     r="2"
     fill="#ffcc00"
     stroke="#333333"
     stroke-width="0.5" />
  <circle
     cx="40"
     cy="47"
     r="2"
     fill="#66ff66"
     stroke="#333333"
     stroke-width="0.5" />
  
  <!-- Antennas (for wireless router option) -->
  <line
     x1="20"
     y1="40"
     x2="20"
     y2="30"
     stroke="#333333"
     stroke-width="2"
     stroke-linecap="round" />
  <line
     x1="80"
     y1="40"
     x2="80"
     y2="30"
     stroke="#333333"
     stroke-width="2"
     stroke-linecap="round" />
  
  <!-- Router Feet -->
  <line
     x1="25"
     y1="65"
     x2="25"
     y2="70"
     stroke="#333333"
     stroke-width="2"
     stroke-linecap="round" />
  <line
     x1="75"
     y1="65"
     x2="75"
     y2="70"
     stroke="#333333"
     stroke-width="2"
     stroke-linecap="round" />
</svg>