<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   version="1.1"
   viewBox="0 0 1200 800"
   width="1200"
   height="800">
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f9f9f9"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#232F3E">Defense-in-Depth for a Public Web Application</text>
  
  <!-- Internet User -->
  <rect x="30" y="360" width="80" height="80" rx="10" ry="10" fill="#E8F4FA" stroke="#00A1C9" stroke-width="1"/>
  <text x="70" y="395" font-family="Arial" font-size="14" text-anchor="middle" fill="#00A1C9">Internet</text>
  <text x="70" y="415" font-family="Arial" font-size="14" text-anchor="middle" fill="#00A1C9">User</text>
  
  <!-- Arrow from User to Edge Layer -->
  <line x1="110" y1="400" x2="150" y2="400" stroke="#232F3E" stroke-width="2"/>
  <polygon points="150,395 160,400 150,405" fill="#232F3E"/>
  
  <!-- Edge Layer Box -->
  <rect x="160.5" y="280.5" width="180" height="240" rx="10" ry="10" fill="#FFF3E0" stroke="#FF9900" stroke-width="1" stroke-dasharray="5, 3"/>
  <text x="252" y="258" font-family="Arial" font-size="12" text-anchor="middle" fill="#FF9900" font-weight="bold">Edge Layer:</text>
  <text x="252" y="273" font-family="Arial" font-size="12" text-anchor="middle" fill="#FF9900" font-weight="bold">First Line of Defense</text>
  
  <!-- Edge Services -->
  <rect x="170.5" y="300.5" width="160" height="40" rx="5" ry="5" fill="#FFFFFF" stroke="#FF9900" stroke-width="1"/>
  <text x="250.5" y="325.5" font-family="Arial" font-size="14" text-anchor="middle" fill="#FF9900">AWS Shield (DDoS)</text>
  
  <rect x="170.5" y="350.5" width="160" height="40" rx="5" ry="5" fill="#FFFFFF" stroke="#FF9900" stroke-width="1"/>
  <text x="250.5" y="375.5" font-family="Arial" font-size="14" text-anchor="middle" fill="#FF9900">CloudFront (CDN)</text>
  
  <rect x="170.5" y="400.5" width="160" height="40" rx="5" ry="5" fill="#FFFFFF" stroke="#FF9900" stroke-width="1"/>
  <text x="250.5" y="425.5" font-family="Arial" font-size="14" text-anchor="middle" fill="#FF9900">AWS WAF</text>
  
  <!-- Arrow from Edge to ALB -->
  <line x1="347" y1="400" x2="410" y2="400" stroke="#232F3E" stroke-width="2.5"/>
  <polygon points="410,395 420,400 410,405" fill="#232F3E"/>
  
  <!-- ALB -->
  <rect x="424" y="370" width="95" height="60" rx="5" ry="5" fill="#E8F4FA" stroke="#00A1C9" stroke-width="1"/>
  <text x="473.5" y="395" font-family="Arial" font-size="14" text-anchor="middle" fill="#00A1C9">ALB</text>
  <text x="473.5" y="415" font-family="Arial" font-size="10" text-anchor="middle" fill="#00A1C9">(Multi-AZ)</text>
  
  <!-- ALB Security Group -->
  <rect x="423" y="330" width="96" height="30" rx="3" ry="3" fill="#F1FAFF" stroke="#00A1C9" stroke-width="1"/>
  <text x="474.5" y="348" font-family="Arial" font-size="10" text-anchor="middle" fill="#00A1C9">ALB SG (443 In)</text>
  
  <!-- Arrow from ALB to VPC -->
  <line x1="520" y1="400" x2="559" y2="400" stroke="#232F3E" stroke-width="2"/>
  <polygon points="559,395 569,400 559,405" fill="#232F3E"/>
  
  <!-- VPC Box -->
  <rect x="570" y="100" width="580" height="600" rx="15" ry="15" fill="none" stroke="#232F3E" stroke-width="2"/>
  <text x="600" y="125" font-family="Arial" font-size="16" fill="#232F3E">VPC</text>
  
  <!-- Public Subnet -->
  <rect x="590" y="140" width="250" height="540" rx="10" ry="10" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="1"/>
  <text x="715" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#555555">Public Subnet(s)</text>
  
  <!-- NACL -->
  <rect x="595" y="175" width="50" height="25" rx="3" ry="3" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1"/>
  <text x="620" y="191" font-family="Arial" font-size="10" text-anchor="middle" fill="#555555">NACL</text>
  
  <!-- Web Tier -->
  <rect x="610" y="210" width="210" height="450" rx="5" ry="5" fill="#FFECC0" stroke="#FF9900" stroke-width="1"/>
  <text x="715" y="235" font-family="Arial" font-size="14" text-anchor="middle" fill="#FF9900">Web Tier (ASG)</text>
  
  <!-- EC2 Instances -->
  <rect x="630" y="255" width="170" height="60" rx="3" ry="3" fill="white" stroke="#FF9900" stroke-width="1"/>
  <text x="715" y="285" font-family="Arial" font-size="12" text-anchor="middle">EC2 Instance (AZ-A)</text>
  <text x="715" y="330" font-family="Arial" font-size="9" text-anchor="middle" fill="#555555">IAM Role, Patching (SSM)</text>
  <text x="715" y="342" font-family="Arial" font-size="9" text-anchor="middle" fill="#555555">Vuln Scan (Inspector)</text>
  
  <rect x="630" y="580" width="170" height="60" rx="3" ry="3" fill="white" stroke="#FF9900" stroke-width="1"/>
  <text x="715" y="610" font-family="Arial" font-size="12" text-anchor="middle">EC2 Instance (AZ-B)</text>
  
  <!-- Web Security Group -->
  <rect x="610" y="670" width="210" height="30" rx="3" ry="3" fill="#F1FAFF" stroke="#00A1C9" stroke-width="1"/>
  <text x="715" y="690" font-family="Arial" font-size="10" text-anchor="middle" fill="#00A1C9">Web SG (Allows from ALB SG)</text>
  
  <!-- Private Subnet -->
  <rect x="877" y="139" width="250" height="540" rx="10" ry="10" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="1"/>
  <text x="1005" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#555555">Private Subnet(s)</text>
  
  <!-- Arrow from Web to DB -->
  <line x1="827" y1="400" x2="866" y2="400" stroke="#232F3E" stroke-width="1.8"/>
  <polygon points="866,395 876,400 866,405" fill="#232F3E"/>
  
  <!-- Private NACL -->
  <rect x="885" y="175" width="50" height="25" rx="3" ry="3" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1"/>
  <text x="910" y="191" font-family="Arial" font-size="10" text-anchor="middle" fill="#555555">NACL</text>
  
  <!-- Data Tier -->
  <rect x="900" y="320" width="210" height="160" rx="5" ry="5" fill="#E9F8E9" stroke="#007F00" stroke-width="1"/>
  <text x="1005" y="345" font-family="Arial" font-size="14" text-anchor="middle" fill="#007F00">Data Tier</text>
  
  <!-- RDS Database -->
  <rect x="920" y="365" width="170" height="60" rx="3" ry="3" fill="white" stroke="#007F00" stroke-width="1"/>
  <text x="1005" y="385" font-family="Arial" font-size="12" text-anchor="middle">RDS Database</text>
  <text x="1005" y="405" font-family="Arial" font-size="10" text-anchor="middle">(Multi-AZ Optional)</text>
  <text x="1005" y="418" font-family="Arial" font-size="9" text-anchor="middle" fill="#555555">Encrypted (KMS)</text>
  
  <!-- DB Security Group -->
  <rect x="900" y="490" width="210" height="30" rx="3" ry="3" fill="#F1FAFF" stroke="#00A1C9" stroke-width="1"/>
  <text x="1005" y="510" font-family="Arial" font-size="10" text-anchor="middle" fill="#00A1C9">DB SG (Allows from Web SG)</text>
  
  <!-- AZ Boundary -->
  <line x1="570" y1="450" x2="1150" y2="450" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1110" y="440" font-family="Arial" font-size="10" fill="#AAAAAA">AZ-A</text>
  <text x="1110" y="470" font-family="Arial" font-size="10" fill="#AAAAAA">AZ-B</text>
  
  <!-- Security Monitoring -->
  <rect x="590" y="700" width="540" height="30" rx="3" ry="3" fill="#FEE" stroke="#D00" stroke-width="1"/>
  <text x="860" y="720" font-family="Arial" font-size="10" text-anchor="middle" fill="#D00">Threat Detection (GuardDuty) &amp; Audit Logging (CloudTrail) Monitor VPC/Account</text>
</svg>
