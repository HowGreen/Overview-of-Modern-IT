       id="text5">Query:</text>
    <text
       x="72.392189"
       y="185.68591"
       class="query-text row-query"
       id="text6">AVG(Sales)</text>
    <text
       x="75.848045"
       y="262.41385"
       class="small-text"
       fill="#d32f2f"
       id="text9">(High I/O)</text>
    <text
       x="77"
       y="235"
       class="small-text"
       fill="#d32f2f"
       id="text10">Must read entire rows with</text>
    <text
