  <!-- Legend -->
  <!-- Notes -->
  <text
     x="450"
     y="534.88165"
     class="heading-label"
     text-anchor="middle"
     id="text45">Key Resilience Properties</text>
  <text
     x="450"
     y="550.4115"
     class="note-text"
     text-anchor="middle"
     id="text46">• Master nodes distributed across all three AZs to maintain quorum if one AZ fails</text>
  <text
     x="450"
     y="570.4115"
     class="note-text"
     text-anchor="middle"
     id="text47">• Worker nodes in each AZ for data redundancy and processing capacity</text>
  <text
     x="450"
     y="590.4115"
     class="note-text"
     text-anchor="middle"
     id="text48">• System can tolerate the complete failure of any single Availability Zone</text>
