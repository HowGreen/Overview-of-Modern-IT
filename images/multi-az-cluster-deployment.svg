      .node-label { font-family: Arial, sans-serif; font-size: 12px; fill: white; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .connection { stroke: #495057; stroke-width: 1.5; stroke-dasharray: 3,3; fill: none; }
