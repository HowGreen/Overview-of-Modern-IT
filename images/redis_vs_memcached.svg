  {/* Redis Characteristics text elements (unchanged) */}
  <text x="70" y="150" class="section-title" id="text3">Key Characteristics:</text>
  <text x="80" y="170" class="point" id="text4">- Rich Data Structures (Lists, Sets, Hashes)</text>
  <text x="80" y="190" class="point" id="text5">- Data Persistence Options (Snapshots, AOF)</text>
  <text x="80" y="210" class="point" id="text6">- Replication / High Availability Features</text>
  <text x="80" y="230" class="point" id="text7">- Pub/Sub Capabilities</text>
  <text x="80" y="250" class="point" id="text8">- Geospatial Indexing</text>
  <text x="80" y="270" class="point" id="text9">- Lua Scripting</text>
  <text x="70" y="300" class="section-title" id="text10">Ideal Use Cases:</text>
  <text x="80" y="320" class="point" id="text11">- Complex Caching (beyond simple K/V)</text>
  <text x="80" y="340" class="point" id="text12">- Session Management</text>
  <text x="80" y="360" class="point" id="text13">- Real-time Leaderboards / Counters</text>
  <text x="80" y="380" class="point" id="text14">- Geospatial Lookups</text>
  
  {/* Memcached Column (unchanged) */}
  <rect x="420" y="80" width="330" height="320" class="memcached-box" id="rect14" />
  <text x="585" y="110" class="engine-title" fill="#1D8102" id="text15">ElastiCache for Memcached</text>
  <circle cx="450" cy="105" r="12" fill="#1D8102" class="icon" id="circle15" />
  <circle cx="450" cy="105" r="8" fill="#ffffff" id="circle16" />
  <path d="M 450 105 L 450 99 A 6 6 0 0 1 455 102 Z" fill="#1D8102" id="path16" />
  <circle cx="450" cy="105" r="1" fill="#1D8102" id="circle17" />
  <text x="440" y="150" class="section-title" id="text17">Key Characteristics:</text>
  <text x="450" y="170" class="point" id="text18">- Simple Key-Value Store</text>
  <text x="450" y="190" class="point" id="text19">- Multi-threaded Architecture (High Throughput)</text>
  <text x="450" y="210" class="point" id="text20">- Designed for Simplicity and Speed</text>
  <text x="450" y="230" class="point" id="text21">- No Built-in Data Persistence</text>
  <text x="450" y="250" class="point" id="text22">- Horizontal Scaling by Adding Nodes</text>
  <text x="450" y="270" class="point" id="text23">- Lower Memory Overhead (potentially)</text>
  <text x="440" y="300" class="section-title" id="text24">Ideal Use Cases:</text>
  <text x="450" y="320" class="point" id="text25">- Basic Object Caching (DB results, rendered pages)</text>
  <text x="450" y="340" class="point" id="text26">- Reducing Database Read Load</text>
  <text x="450" y="360" class="point" id="text27">- Scenarios needing maximum simplicity/raw speed</text>
  <text x="450" y="380" class="point" id="text28">- Caching where data loss is acceptable</text>
</svg>