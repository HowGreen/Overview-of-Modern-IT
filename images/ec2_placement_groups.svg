<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 900 450" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: Arial; font-size: 20px; text-anchor: middle; font-weight: bold; }
    .subtitle { font-family: Arial; font-size: 16px; text-anchor: middle; font-weight: bold; }
    .label { font-family: Arial; font-size: 12px; text-anchor: middle; }
    .note { font-family: Arial; font-size: 11px; text-anchor: middle; fill: #333; }
    .partition-label { font-family: Arial; font-size: 10px; text-anchor: middle; fill: #555; }
    .box { stroke: #cccccc; stroke-width: 1; rx: 5; ry: 5; fill: #f0f0f0;} /* Box for each section */
    .rack { fill: #EAEAEA; stroke: #B0B0B0; stroke-width: 1; rx: 2; ry: 2; }
    /* Instance Icon Style using Option C */
    .instance-body { fill: #FF9900; /* EC2 Orange */ stroke: #232F3E; /* Dark Border */ stroke-width: 1; }
    .instance-detail { fill: #ffffff; /* White */ stroke: none; }
  </style>

  <defs>
      <g id="instance-icon">
          <rect x="0" y="0" width="30" height="24" rx="3" ry="3" class="instance-body"/>
          <rect x="7" y="6" width="16" height="12" rx="1" ry="1" class="instance-detail"/>
      </g>
  </defs>

  <rect width="900" height="450" fill="#f8f9fa" />

  <text x="450" y="40" class="title">EC2 Placement Group Strategies</text>

  <rect x="30" y="70" width="260" height="330" class="box" />
  <text x="160" y="100" class="subtitle">Cluster</text>
  <rect x="60" y="130" width="200" height="150" class="rack" />
  <text x="160" y="300" class="note">Instances close together</text>
  <text x="160" y="315" class="note">on single hardware rack.</text>
  <text x="160" y="335" class="note" font-weight="bold">Use: Low latency</text>
  <text x="160" y="350" class="note" font-weight="bold">Risk: Shared fate</text>
  <use href="#instance-icon" x="80" y="150" />
  <use href="#instance-icon" x="120" y="150" />
  <use href="#instance-icon" x="160" y="150" />
  <use href="#instance-icon" x="200" y="150" />
  <use href="#instance-icon" x="100" y="190" />
  <use href="#instance-icon" x="140" y="190" />
  <use href="#instance-icon" x="180" y="190" />


  <rect x="320" y="70" width="260" height="330" class="box" />
  <text x="450" y="100" class="subtitle">Spread</text>
  <rect x="350" y="130" width="45" height="150" class="rack" />
  <rect x="405" y="130" width="45" height="150" class="rack" />
  <rect x="460" y="130" width="45" height="150" class="rack" />
  <rect x="515" y="130" width="45" height="150" class="rack" />
  <text x="450" y="300" class="note">Instances spread across</text>
  <text x="450" y="315" class="note">distinct hardware racks.</text>
   <text x="450" y="335" class="note" font-weight="bold">Use: Max fault tolerance</text>
   <text x="450" y="350" class="note" font-weight="bold">Risk: Higher latency</text>
  <use href="#instance-icon" x="357.5" y="190" />
  <use href="#instance-icon" x="412.5" y="190" />
  <use href="#instance-icon" x="467.5" y="190" />
  <use href="#instance-icon" x="522.5" y="190" />


  <rect x="610" y="70" width="260" height="330" class="box" />
  <text x="740" y="100" class="subtitle">Partition</text>
  <rect x="630" y="130" width="90" height="150" class="rack" />
  <text x="675" y="290" class="partition-label">Partition 1</text>
  <rect x="730" y="130" width="90" height="150" class="rack" />
   <text x="775" y="290" class="partition-label">Partition 2</text>
   <text x="740" y="305" class="note">Instances grouped into</text>
   <text x="740" y="320" class="note">partitions on distinct racks.</text>
   <text x="740" y="340" class="note" font-weight="bold">Use: Partition-aware apps</text>
   <text x="740" y="355" class="note" font-weight="bold">(Hadoop, Kafka)</text>
  <use href="#instance-icon" x="640" y="150" />
  <use href="#instance-icon" x="680" y="150" />
  <use href="#instance-icon" x="660" y="190" />
  <use href="#instance-icon" x="740" y="150" />
  <use href="#instance-icon" x="780" y="150" />
  <use href="#instance-icon" x="760" y="190" />

</svg>