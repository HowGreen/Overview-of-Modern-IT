<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Service-Centric vs Infrastructure-Centric Availability Metrics</text>
  
  <!-- Left Side: Infrastructure-Centric -->
  <rect x="50" y="60" width="340" height="300" rx="5" ry="5" fill="#f0f0f0" stroke="#232F3E" stroke-width="1"/>
  <text x="220" y="85" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Infrastructure-Centric View</text>
  
  <!-- Server Metrics -->
  <rect x="70" y="100" width="300" height="60" rx="3" ry="3" fill="#FF9900" stroke="#232F3E" stroke-width="1"/>
  <text x="220" y="125" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Server Uptime: 99.99%</text>
  <text x="220" y="145" font-family="Arial" font-size="12" text-anchor="middle">EC2 instances running</text>
  
  <!-- Network Metrics -->
  <rect x="70" y="170" width="300" height="60" rx="3" ry="3" fill="#1D8102" stroke="#232F3E" stroke-width="1"/>
  <text x="220" y="195" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Network Connectivity: 99.95%</text>
  <text x="220" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Network paths available</text>
  
  <!-- Database Metrics -->
  <rect x="70" y="240" width="300" height="60" rx="3" ry="3" fill="#3B48CC" stroke="#232F3E" stroke-width="1"/>
  <text x="220" y="265" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Database Availability: 99.95%</text>
  <text x="220" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Database accepting connections</text>
  
  <!-- Problems -->
  <rect x="70" y="310" width="300" height="40" rx="3" ry="3" fill="#D13212" stroke="#232F3E" stroke-width="1"/>
  <text x="220" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Great metrics don't guarantee good user experience</text>
  
  <!-- Right Side: Service-Centric -->
  <rect x="410" y="60" width="340" height="300" rx="5" ry="5" fill="#f0f0f0" stroke="#232F3E" stroke-width="1"/>
  <text x="580" y="85" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Service-Centric View</text>
  
  <!-- Successful Request SLO -->
  <rect x="430" y="100" width="300" height="60" rx="3" ry="3" fill="#FF9900" stroke="#232F3E" stroke-width="1"/>
  <text x="580" y="125" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">API Request Success Rate: 99.9%</text>
  <text x="580" y="145" font-family="Arial" font-size="12" text-anchor="middle">Requests completing successfully</text>
  
  <!-- User Journey SLO -->
  <rect x="430" y="170" width="300" height="60" rx="3" ry="3" fill="#1D8102" stroke="#232F3E" stroke-width="1"/>
  <text x="580" y="195" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">User Journey Completion: 99.5%</text>
  <text x="580" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Users completing critical workflows</text>
  
  <!-- Business Function SLO -->
  <rect x="430" y="240" width="300" height="60" rx="3" ry="3" fill="#3B48CC" stroke="#232F3E" stroke-width="1"/>
  <text x="580" y="265" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Order Processing: 99.95%</text>
  <text x="580" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Orders successfully captured &amp; processed</text>
  
  <!-- Benefits -->
  <rect x="430" y="310" width="300" height="40" rx="3" ry="3" fill="#006E51" stroke="#232F3E" stroke-width="1"/>
  <text x="580" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Directly measures what matters to users &amp; business</text>
  
  <!-- Key Points -->
  <text x="400" y="375" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Service Level Objectives Focus on User Outcomes, Not Component Status</text>
  <text x="400" y="395" font-family="Arial" font-size="12" text-anchor="middle">Availability is measured by successful user interactions, not just infrastructure uptime</text>
</svg>
